name: gameverse
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6  # For state management and navigation
  equatable: ^2.0.5
  get_storage: ^2.1.1
  google_fonts: ^6.2.1  # For custom fonts
  shared_preferences: ^2.2.2  # For local storage
  flutter_animate: ^4.5.2  # For smooth animations
  cached_network_image: ^3.3.0  # For image caching
  flutter_svg: ^2.0.9  # For SVG support
  lottie: ^3.3.1  # For Lottie animations
  logger: ^2.5.0
  sensors_plus: ^6.1.1  # For accelerometer and gyroscope
  connectivity_plus: ^6.1.2  # For network status monitoring
  uuid: ^4.3.3  # For unique game IDs
  json_annotation: ^4.8.1
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.0
  flutter_vector_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3
  # JSON serialization generators
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
  assets:
    # Chess low-latency PCM sound pack
    - assets/chess/sounds_v2/
    
    # Other game assets
    - assets/sounds/drop.mp3
    - assets/sounds/win.mp3
    - assets/sounds/memory_flip.wav
    - assets/sounds/memory_match.wav
    - assets/sounds/memory_miss.wav
    - assets/sounds/memory_win.wav
    - assets/images/
    - assets/images/categories/
    - assets/images/games/
    - assets/images/games/memory_match/
    - assets/images/games/chess/
    - assets/images/games/chess/pieces_v2/
    - assets/images/games/chess/board_textures/
    - assets/images/home/games/
    - assets/images/google_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A2D78"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#071A42"
    theme_color: "#0A2D78"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

