name: gameverse
description: "Seven offline games with local play, AI opponents and on-device progress."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  equatable: ^2.1.0 # Keep runtime-type equality until a deliberate v3 migration.
  get_storage: ^2.1.1
  flutter_animate: ^4.5.2  # For smooth animations
  logger: ^2.8.0
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
        - asset: assets/fonts/Outfit-900.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
        - asset: assets/fonts/Inter-900.ttf
          weight: 900
    - family: QuizDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BlockResin
      fonts:
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
  assets:
    - docs/PRIVACY_POLICY.md
    - assets/fonts/Outfit-OFL.txt
    - assets/fonts/Inter-OFL.txt
    # Chess low-latency PCM sound pack
    - assets/chess/sounds_v2/
    
    # Other game assets
    - assets/sounds/memory_flip.wav
    - assets/sounds/memory_match.wav
    - assets/sounds/memory_miss.wav
    - assets/sounds/memory_win.wav
    - assets/images/games/
    - assets/images/games/flappy_bird/
    - assets/images/games/memory_match/
    - assets/images/games/tic_tac_toe/
    - assets/images/games/connect_four/
    - assets/images/games/block_merge/
    - assets/images/games/quiz_master/room.png
    - assets/images/games/quiz_master/hero.png
    - assets/images/games/quiz_master/header-v2.png
    - assets/images/games/quiz_master/science-v2.png
    - assets/images/games/quiz_master/history-v2.png
    - assets/images/games/quiz_master/geography-v2.png
    - assets/images/games/quiz_master/mathematics-v2.png
    - assets/images/games/quiz_master/technology-banner-v2.png
    - assets/sounds/quiz_master/
    - assets/images/games/quiz_master/science.png
    - assets/images/games/quiz_master/history.png
    - assets/images/games/quiz_master/geography.png
    - assets/images/games/quiz_master/mathematics.png
    - assets/images/games/quiz_master/technology.png
    - assets/images/games/quiz_master/trophy.png
    - assets/images/games/quiz_master/help.png
    - assets/images/games/quiz_master/leave.png
    - assets/sounds/block_merge/
    - assets/images/games/chess/
    - assets/images/games/chess/pieces_v2/
    - assets/images/games/chess/board_textures/
    - assets/images/home/games/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A2D78"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#071A42"
    theme_color: "#0A2D78"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

