org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.builtInKotlin=true
# Flutter 3.47 still requires legacy DSL compatibility for AGP 9.
android.newDsl=false
# Avoid Kotlin daemon incremental-cache collisions across Flutter plugin modules
# on Windows. This trades a little build speed for deterministic local builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
